version: 0.2

phases:

  install:
    commands:
      - echo "Installing Databricks CLI"

      - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - export PATH="$HOME/.databricks/bin:$PATH"

      - databricks version

  pre_build:
    commands:
      - echo "Configuring Databricks CLI..."

      - mkdir -p ~/.databricks

      - |
        cat > ~/.databrickscfg <<EOF
        [DEFAULT]
        host=$DATABRICKS_HOST
        token=$DATABRICKS_TOKEN
        EOF

      - echo "===== CLI VERSION ====="
      - databricks --version

      - echo "===== HOST ====="
      - echo $DATABRICKS_HOST

      - echo "===== TOKEN LENGTH ====="
      - echo ${#DATABRICKS_TOKEN}

      - echo "===== CONFIG ====="
      - cat ~/.databrickscfg

  build:
    commands:

      - echo "===== Listing DBFS Root ====="
      - databricks fs ls dbfs:/

      - echo "===== Listing Workspace ====="
      - databricks fs ls dbfs:/Workspace || true

      - echo "===== Uploading Python File ====="
      - databricks fs cp src/customer_job.py dbfs:/Workspace/customer_job.py --overwrite

      - echo "===== Verifying Upload ====="
      - databricks fs ls dbfs:/Workspace

  post_build:
    commands:
      - echo "Build Completed"